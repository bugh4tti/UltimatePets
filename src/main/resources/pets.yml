# texture: valor base64 de minecraft-heads.com (opcional).
# Si texture está vacío se usa "material" como cabeza.
# boost.type: EXP (lo aplica el plugin). Los demás tipos (ESENCIAS, TOKENS, PERLAS...)
# se leen desde otros plugins con la API getMultiplier(player, "TIPO").
# Multiplicador = base + per-level * (nivel - 1)
pets:
